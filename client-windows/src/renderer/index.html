<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RB-VPN</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="shell">
      <header>
        <div class="brand">RB-VPN</div>
        <div id="status-pill" class="pill off">Disconnected</div>
      </header>

      <section id="view-login" class="card">
        <h1>Sign in</h1>
        <p class="muted">Secure access through RB-VPN.</p>
        <label>Email</label>
        <input id="email" type="email" autocomplete="username" />
        <label>Password</label>
        <input id="password" type="password" autocomplete="current-password" />
        <details class="advanced">
          <summary>Advanced</summary>
          <label>Server</label>
          <input id="apiUrl" type="text" placeholder="https://api.example.com" />
        </details>
        <button id="btn-login" class="primary">Login</button>
        <p id="login-error" class="error"></p>
        <p class="hint">No account? Create one on the RB-VPN website.</p>
      </section>

      <section id="view-app" class="hidden">
        <div class="card">
          <p class="muted" id="user-email"></p>
          <p id="sub-line">Checking subscription…</p>
          <label>Server node</label>
          <select id="nodeSelect"></select>
          <div class="row" id="connect-row">
            <button id="btn-connect" class="primary">Connect</button>
            <button id="btn-disconnect" class="ghost hidden">Disconnect</button>
          </div>
          <p id="app-msg" class="muted"></p>
          <p id="log-hint" class="hint"></p>
          <button id="btn-open-log" class="link" type="button">Open connect log</button>
        </div>
        <button id="btn-logout" class="link">Log out</button>
      </section>
    </div>
    <script src="app.js"></script>
  </body>
</html>
